  <!-- Fonts & Tailwind -->

  <style>
    :root {
      --bg: #08080c;
      --bg-elevated: #0f0f14;
      --card: #111116;
      --border: #1f1f28;
      --fg: #f4f4f6;
      --muted: #8b8b9b; /* Brighter muted text for readability */
      --accent: #ff5e4d;
      --accent-glow: rgba(255, 94, 77, 0.35);
      --secondary: #3dd9d9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      overflow-x: hidden;
    }

    h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* Background Effects */
    .bg-gradient-mesh {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: 
        radial-gradient(ellipse 80% 50% at 20% 20%, rgba(255, 94, 77, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(61, 217, 217, 0.08) 0%, transparent 50%),
        var(--bg);
    }
    
    .noise-overlay {
      position: fixed; inset: 0; z-index: -1; opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* Animations */
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes wave {
      0%, 100% { height: 20%; }
      50% { height: 100%; }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 0.5; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .animate-slide-up {
      animation: slide-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }
    
    .reveal {
      opacity: 0; transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* Visualizer Bars */
    .visualizer-bar {
      animation: wave 1s ease-in-out infinite;
    }

    /* Card Hover */
    .track-card {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      background: var(--card);
      border: 1px solid var(--border);
    }
    .track-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--accent);
    }
    .track-card img { transition: transform 0.5s ease; }
    .track-card:hover img { transform: scale(1.05); }

    /* Play Button Pulse */
    .play-btn-pulse::before {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      background: var(--accent); animation: pulse-ring 1.5s ease-out infinite;
    }

    /* Volume Slider Custom Style */
    .volume-slider {
      -webkit-appearance: none; appearance: none;
      height: 4px; background: var(--border); border-radius: 2px; outline: none;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      background: var(--accent); border-radius: 50%; cursor: pointer;
      transition: transform 0.2s;
    }
    .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }

    /* Utility */
    .text-accent { color: var(--accent); }
    .bg-card { background: var(--card); }
  </style>
</head>
<body>

  <!-- Floating Volume Controller -->
  <div class="fixed bottom-6 right-6 z-50 group">
    <div class="flex items-center gap-3 bg-[#111116]/90 backdrop-blur-xl rounded-full p-3 border border-[#1f1f28] shadow-xl transition-all hover:px-4">
      <!-- Mute Button -->
      <button id="mute-btn" class="relative z-10 text-[#8b8b9b] hover:text-white transition-colors">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" id="vol-icon-on"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <svg class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 24 24" id="vol-icon-off"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
      </button>
      <!-- Slider -->
      <div class="w-0 overflow-hidden group-hover:w-24 transition-all duration-300">
        <input type="range" id="master-volume" min="0" max="100" value="80" class="volume-slider w-full">
      </div>
    </div>
  </div>

  <script>
    // === CONFIGURATION ===
    const YOUTUBE_CHANNEL_ID = 'UCi7dyzSxgO7Hsn8EkcTi7sg';

    // === VISUALIZER ===
    const visualizer = document.getElementById('visualizer');
    const barCount = 40;
    
    for (let i = 0; i < barCount; i++) {
      const bar = document.createElement('div');
      bar.className = 'visualizer-bar w-1 md:w-1.5 bg-gradient-to-t from-[#ff5e4d] to-[#3dd9d9] rounded-full';
      bar.style.height = '20%';
      bar.style.animationDelay = `${Math.random() * 1}s`;
      bar.style.animationDuration = `${0.6 + Math.random() * 0.6}s`;
      visualizer.appendChild(bar);
    }

    // === SCROLL REVEAL ===
    const reveals = document.querySelectorAll('.reveal');
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1 });
    reveals.forEach(el => revealObserver.observe(el));

    // === YOUTUBE FEED ===
    async function fetchYouTube() {
      const feedUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${YOUTUBE_CHANNEL_ID}`;
      const rss2jsonUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`;
      
      try {
        const res = await fetch(rss2jsonUrl);
        const data = await res.json();
        
        if (data.status === 'ok') {
          const items = data.items.slice(0, 6);
          const container = document.getElementById('youtube-feed');
          container.innerHTML = '';

          items.forEach(item => {
             const card = document.createElement('a');
             card.href = item.link;
             card.target = '_blank';
             card.className = 'track-card rounded-2xl overflow-hidden group relative';
             
             // Extract high quality thumbnail
             const thumb = item.thumbnail; 
             const pubDate = new Date(item.pubDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

             card.innerHTML = `
               <div class="aspect-video bg-[#111116] overflow-hidden relative">
                 <img src="${thumb}" alt="${item.title}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500"/>
                 <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
               </div>
               <div class="absolute bottom-0 left-0 right-0 p-5">
                 <h3 class="font-semibold text-white mb-1 line-clamp-2 leading-snug text-shadow">${item.title}</h3>
                 <div class="flex items-center gap-2 text-xs text-white/70">
                    <span class="w-1 h-1 rounded-full bg-[#ff5e4d]"></span>
                    ${pubDate}
                 </div>
               </div>
               <!-- Play Icon Overlay -->
               <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-14 h-14 rounded-full bg-white/10 backdrop-blur-sm flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300 transform group-hover:scale-100 scale-75 shadow-lg">
                  <svg class="w-8 h-8 text-white ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
               </div>
             `;
             container.appendChild(card);
          });
        } else {
           console.error("RSS Error:", data.message);
           document.getElementById('youtube-feed').innerHTML = `<p class="text-[#8b8b9b] col-span-full text-center">Could not load YouTube feed.</p>`;
        }
      } catch (error) {
        console.error("Fetch Error:", error);
      }
    }

    fetchYouTube();

    // === GLOBAL VOLUME CONTROLLER ===
    const masterVolume = document.getElementById('master-volume');
    const muteBtn = document.getElementById('mute-btn');
    const volIconOn = document.getElementById('vol-icon-on');
    const volIconOff = document.getElementById('vol-icon-off');
    
    let lastVolume = 80;

    masterVolume.addEventListener('input', (e) => {
      const vol = e.target.value;
      // In a full implementation, you would control the audio element here
      // For this site, it's primarily a visual controller unless you add local audio
      if (vol > 0) {
        volIconOn.classList.remove('hidden');
        volIconOff.classList.add('hidden');
      } else {
        volIconOn.classList.add('hidden');
        volIconOff.classList.remove('hidden');
      }
    });

    muteBtn.addEventListener('click', () => {
       if (masterVolume.value > 0) {
         lastVolume = masterVolume.value;
         masterVolume.value = 0;
         volIconOn.classList.add('hidden');
         volIconOff.classList.remove('hidden');
       } else {
         masterVolume.value = lastVolume;
         volIconOn.classList.remove('hidden');
         volIconOff.classList.add('hidden');
       }
    });

  </script>
</body>
