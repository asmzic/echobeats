<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoBeats | A Sound World by ASMZIC</title>

  <!-- SEO & Social Media Meta -->
  <meta name="title" content="EchoBeats | A Sound World by ASMZIC">
  <meta name="description" content="Immerse yourself in the world of sound by ASMZIC — remastered Lofi, Reverb, and Acoustic tracks with a touch of emotion.">
  <meta name="author" content="ASMZIC">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://asmzic.github.io/echobeats/">
  <meta property="og:title" content="EchoBeats | A Sound World by ASMZIC">
  <meta property="og:description" content="Immerse yourself in the world of sound by ASMZIC — remastered Lofi, Reverb, and Acoustic tracks with a touch of emotion.">
  <meta property="og:image" content="https://asmzic.github.io/echobeats/images/default-cover.jpg">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://asmzic.github.io/echobeats/">
  <meta name="twitter:title" content="EchoBeats | A Sound World by ASMZIC">
  <meta name="twitter:description" content="Immerse yourself in the world of sound by ASMZIC — remastered Lofi, Reverb, and Acoustic tracks with a touch of emotion.">
  <meta name="twitter:image" content="https://asmzic.github.io/echobeats/images/default-cover.jpg">
  <link 
  rel="alternate"
  type="application/rss+xml"
  title="ASMZIC YouTube Feed"
  href="https://www.youtube.com/feeds/videos.xml?channel_id=YOUR_CHANNEL_ID">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JV6KLJ1ZM9"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JV6KLJ1ZM9');
  </script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Particle and audio spectrum canvases -->
  <canvas id="particle-canvas"></canvas>
  <canvas id="spectrum-canvas"></canvas>

  <!-- Parallax layers for 3D depth effect -->
  <div class="parallax-layer layer1"></div>
  <div class="parallax-layer layer2"></div>
  <div class="parallax-layer layer3"></div>

  <!-- Floating ribbon -->
  <div class="ribbon"></div>

  <!-- Header -->
  <header>
    <h1>🎧 EchoBeats</h1>
    <p>A Sound World by ASMZIC</p>
    <button id="theme-toggle">🌙</button>
  </header>

  <!-- Main Player Section -->
  <main>
    <section class="player">
      <img id="cover" src="images/default-cover.jpg" alt="Album cover" />
      <h2 id="song-title">No song playing</h2>

      <!-- Audio engine -->
      <audio id="audio"></audio>

      <!-- Progress bar + time -->
       <div class="progress-wrapper">
        <span id="current-time">0:00</span>
        <div class="progress-container">
          <div id="progress"></div>
        </div>
        <span id="duration">0:00</span>
      </div>
      
      <!-- Player Controls -->
       <div class="controls">
        <button id="prev">⏮</button>
        <button id="play">▶️</button>
        <button id="next">⏭</button>
      </div>
      
      <!-- 🎧 Volume Control -->
       <div class="volume-wrapper">
        <button id="mute-btn" title="Volume">🔊</button>
        <div class="volume-popup">
          <input type="range" id="volume-slider" min="0" max="100" value="80" orient="vertical">
          <span id="volume-value">80%</span>
        </div>
      </div>
    </section>
    <section class="soundcloud-section reveal">
      <h2>🎶 SoundCloud</h2>
      <iframe 
      width="100%" 
      height="300" 
      scrolling="no" 
      frameborder="no" 
      allow="autoplay" 
      src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/playlists/soundcloud%253Aplaylists%253A2178804386&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true">
    </iframe>  
    </section>

    <section class="youtube-section reveal">
      <h2>Latest YouTube Uploads</h2>
      <div id="youtube-feed"></div>
    </section>

    <!-- Playlist -->
    <section class="playlist">
      <h3>🎵 Playlist</h3>
      <ul id="song-list">
        <!-- Songs will be loaded dynamically -->
      </ul>
    </section>
  </main>

  <!-- Queue Section -->
  <section class="queue">
    <h3>🎶 Up Next</h3>
    <ul id="queue-list"></ul>
  </section>

  <!-- Footer -->
   <footer>
    <p>© 2026 EchoBeats | ASMZIC</p>
    <div class="social-links">
      <a href="https://www.instagram.com/arpitsmasih3/" target="_blank" rel="noopener" style="display: inline-flex; align-items: center;">
        <img src="images/instagram-brands-solid-full.svg" alt="Instagram" style="width:20px; height:20px; margin-right:6px;">
        Instagram
      </a>
      |
      <a href="https://www.youtube.com/@echobeats22" target="_blank" rel="noopener" style="display: inline-flex; align-items: center;">
        <img src="images/youtube-brands-solid-full.svg" alt="YouTube" style="width:20px; height:20px; margin-right:6px;">
        YouTube
      </a>
    </div>
  </footer>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
